
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile

    environment:
      DB_PATH: /data/aimrabs.sqlite3

    volumes:
      - aimrabs-data:/data

    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine

    ports:
      - "80:80"

    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - api

    restart: unless-stopped

volumes:
  aimrabs-data: