<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AimRabs | 60초 에임 테스트</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/script.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>AimRabs</h1>
      <p>60초 동안 최대한 많은 원을 클릭하세요.</p>
    </header>

    <section class="game">
      <div class="hud">
        <div><span>TIME</span><strong id="time">60.0</strong></div>
        <div><span>SCORE</span><strong id="score">0</strong></div>
      </div>

      <div id="board" class="board">
        <form id="start-screen" class="screen">
          <h2>READY?</h2>
          <label for="nickname">닉네임</label>
          <input id="nickname" type="text" maxlength="16"
                 autocomplete="nickname" placeholder="닉네임 입력" required>
          <button type="submit">START</button>
          <button type="button" id="view-ranking-button" class="secondary">랭킹 보기</button>
          <p id="start-error" class="error hidden" role="alert"></p>
        </form>

        <div id="countdown" class="countdown hidden" aria-live="polite">3</div>
        <button id="target" class="target hidden" type="button"
                tabindex="-1" aria-label="표적"></button>

        <section id="result-screen" class="screen result hidden">
          <h2 id="result-title">GAME OVER</h2>
          <p id="final-score" class="final-score">0점</p>
          <p id="my-rank"></p>
          <h3>GLOBAL TOP 10</h3>
          <ol id="leaderboard"></ol>
          <p id="result-status" class="notice" role="status" aria-live="polite"></p>
          <div class="actions">
            <button id="refresh-ranking-button" type="button" class="secondary">랭킹 새로고침</button>
            <button id="retry-save-button" type="button" class="secondary hidden">기록 저장 재시도</button>
            <button id="retry-button" type="button">다시 도전</button>
            <button id="change-name-button" type="button" class="secondary">닉네임 변경</button>
          </div>
        </section>
      </div>
      <p class="help">원 클릭 +1점 · 빈 공간 클릭 0점</p>
    </section>
  </main>
</body>
</html>
